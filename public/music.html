<!DOCTYPE html>
<style>
  .release-content {
    display: flex;
    align-items: center;
    justify-content: left;
    flex-wrap: wrap;
    flex-direction: row;
    padding: 10px 10px;
    gap: 10px;
    margin: 0;
  }

  .release-info {
    width: 150px;
    height: 200px;
    border: solid black 1px;
  }
  .release-title {
    text-align: center;
    font-family: 'Boldonse';
    padding: 10px;
  }
</style>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Public</title>
    <link href="style.css" rel="stylesheet" type="text/css" media="all">
    <link href='https://fonts.googleapis.com/css?family=Boldonse' rel='stylesheet'>
  </head>
  <body style="background-color:#546A7B">
    <h1>QUEUE PUBLIC</h1>

    <div class="main-content">
    
      <div class="nav-bar">
        <h3><a href="https://queuepublic.neocities.org/home">home</a></h3>
        <h3><a href="https://queuepublic.neocities.org/music">music</a></h3>
        <h3><a href="https://queuepublic.neocities.org/gallery">gallery</a></h3>
        <h3><a href="https://queuepublic.neocities.org/socials">socials</a></h3>
      </div>
      
      <div class="blog-content">
        <div class="blog-title">music</div>

        <section class="release-content">

          <div class="release-info">
            <img src="static/temp.png" alt="meow!">
            <div class="release-title">Release 1</div>
          </div>
          
          <div class="release-info">
            <img src="static/temp.png" alt="meow!">
            <div class="release-title">Release 2</div>
          </div>

          <div class="release-info">
            <img src="static/temp.png" alt="meow!">
            <div class="release-title">Release 3</div>
          </div>

          <div class="release-info">
            <img src="static/temp.png" alt="meow!">
            <div class="release-title">Release 4</div>
          </div>

          <div class="release-info">
            <img src="static/temp.png" alt="meow!">
            <div class="release-title">Release 5</div>
          </div>
        </section>
        
      </div>
      
      <div class="player-content">
        <p> Music player </p>
      </div>
      
    </div>
    
    <p>Website under development here is our <a href="https://queuepublic.bandcamp.com/">bandcamp</a> for now :]</p>
