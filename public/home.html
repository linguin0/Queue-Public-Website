<!DOCTYPE html>
<style>
  body {
    color: #0D1F2D;
    font-family: Verdana;
  }
  h1 {
    text-align: center;
    font-size: 50px;
    color: white;
    font-family: 'Boldonse';
  }
  .main-content {
    display: flex;
    justify-content: center;
    height: 400px;
    padding-left: 20px;
    padding-right: 20px;
    gap: 10px;
  }
  .nav-bar {
    justify-content: center;
    align-items: center;
    width: 150px;
    border-radius: 25px;
    border: 5px solid #0D1F2D;
    padding: 20px;
    background-color: #9EA3B0;
    font-family: 'Boldonse';
  }
  .nav-bar a {
    color: #0D1F2D;
    text-decoration: none;
  }
  .blog-content {
    justify-content: center;
    align-items: center;
    width: 750px;
    border-radius: 25px;
    border: 5px solid #0D1F2D;
    padding: 20px;
    background-color: #C3C8D4;
    overflow-y: auto;
  }
  .blog-title {
    text-align: center;
    font-size: 30px;
    color: solid #0D1F2D;
    text-decoration-style: solid;
    font-family: 'Boldonse';
    padding-bottom: 20px;
  }
  .player-content {
    justify-content: center;
    align-items: center;
    width: 250px;
    border-radius: 25px;
    border: 5px solid #0D1F2D;
    padding: 20px;
    background-color: #9EA3B0;
  }
  .blog-post-content {
    justify-content: center;
    border: 2px solid #0D1F2D;
    background-color: #ffffff;
    border-radius: 25px;
    padding: 20px;
    padding-top: 5px;
  }
  #blog-post-date {
    color: solid black;
    text-decoration-style: solid;
    font-family: 'Courier New';
  }
  #blog-post-title {
    color: solid black;
    text-decoration-style: solid;
    font-family: 'Boldonse';
  }
</style>

<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Public</title>
    <!-- The style.css file allows you to change the look of your web pages.
         If you include the next line in all your web pages, they will all share the same look.
         This makes it easier to make new pages for your site. -->
    <link href="/style.css" rel="stylesheet" type="text/css" media="all">
    <link href='https://fonts.googleapis.com/css?family=Boldonse' rel='stylesheet'>
  </head>
  <script>
    async function displayBlogPosts() {
      var blog_posts = await fetch("blog.json")
        .then(response => {
          return response.json()
        })
      var values = Object.values(blog_posts).reverse()
      for (var i = 0; i < values.length; i++) {
        let data = values[i];
        document.getElementById("blog-posts").innerHTML += '<div class="blog-post-content"><p id="blog-post-date">' + data.date + '</p><p id="blog-post-title">' + data.title + '</p><p>' + data.text + '</p></div><br>'
      }
    }
  </script>
  <body style="background-color:#546A7B" onload="displayBlogPosts()">
    <h1>QUEUE PUBLIC</h1>

    <div class="main-content">
    
      <div class="nav-bar">
        <h3><a href="https://queuepublic.neocities.org/home">home</a></h3>
        <h3><a href="https://queuepublic.neocities.org/music">music</a></h3>
        <h3><a href="https://queuepublic.neocities.org/gallery">gallery</a></h3>
        <h3><a href="https://queuepublic.neocities.org/socials">socials</a></h3>
      </div>
      
      <div class="blog-content">
        <div class="blog-title">blog</div>

        <div class="blog-scroll-content">
          <div id="blog-posts"></div>
        </div>
      </div>
      
      <div class="player-content">
        <p> Music player </p>
      </div>
      
    </div>
    
    <p>Website under development here is our <a href="https://queuepublic.bandcamp.com/">bandcamp</a> for now :]</p>
  </body>
</html>
