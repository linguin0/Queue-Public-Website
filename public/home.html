<!DOCTYPE html>
<style>
  body {
    color: black;
    font-family: Verdana;
  }
  h1 {
    text-align: center;
    font-size: 50px;
    color: white;
    font-family: 'Boldonse';
  }
  .main-content {
    display: flex;
    justify-content: center;
    height: 400px;
    padding-left: 20px;
    padding-right: 20px;
    gap: 10px;
  }
  .nav-bar {
    justify-content: center;
    align-items: center;
    width: 150px;
    border-radius: 25px;
    border: 5px solid #0D1F2D;
    padding: 20px;
    background-color: #9EA3B0;
    font-family: 'Boldonse';
  }
  .nav-bar a {
    color: #0D1F2D;
    text-decoration: none;
  }
  .blog-content {
    justify-content: center;
    align-items: center;
    width: 750px;
    border-radius: 25px;
    border: 5px solid #0D1F2D;
    padding: 20px;
    background-color: #C3C8D4;
  }
  .blog-title {
    text-align: center;
    font-size: 30px;
    color: solid black;
    text-decoration-style: solid;
    font-family: 'Boldonse';
  }
  .player-content {
    justify-content: center;
    align-items: center;
    width: 250px;
    border-radius: 25px;
    border: 5px solid #0D1F2D;
    padding: 20px;
    background-color: #9EA3B0;
  }
</style>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Public</title>
    <!-- The style.css file allows you to change the look of your web pages.
         If you include the next line in all your web pages, they will all share the same look.
         This makes it easier to make new pages for your site. -->
    <link href="/style.css" rel="stylesheet" type="text/css" media="all">
    <link href='https://fonts.googleapis.com/css?family=Boldonse' rel='stylesheet'>
  </head>
  
  <body style="background-color:#546A7B">
    <h1>QUEUE PUBLIC</h1>

    <div class="main-content">
    
      <div class="nav-bar">
        <h3><a href="https://queuepublic.neocities.org/home">home</a></h3>
        <h3><a href="https://queuepublic.neocities.org/music">music</a></h3>
        <h3><a href="https://queuepublic.neocities.org/gallery">gallery</a></h3>
        <h3><a href="https://queuepublic.neocities.org/socials">socials</a></h3>
      </div>
      
      <div class="blog-content">
        <div class="blog-title">blog</div>
      </div>
      
      <div class="player-content">
        hi
      </div>
      
    </div>
    
    <p>Website under development here is our <a href="https://queuepublic.bandcamp.com/">bandcamp</a> for now :]</p>
  </body>
</html>
